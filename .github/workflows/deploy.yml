name: Deploy Apps Script
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: jadwal-pelayanan-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm run validate && npm test
      - name: Check deployment secrets
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          CLASP_JSON: ${{ secrets.CLASP_JSON }}
        run: node scripts/check-secrets.mjs
      - name: Restore clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          CLASP_JSON: ${{ secrets.CLASP_JSON }}
        run: |
          install -d -m 700 "$HOME/.clasprc"
          umask 077
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          printf '%s' "$CLASP_JSON" > .clasp.json
      - name: Deploy versioned web app
        run: npm run deploy
      - name: Cleanup credentials
        if: always()
        run: rm -f "$HOME/.clasprc.json" .clasp.json
