name: CI
on:
  pull_request:
  push:
    branches-ignore: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm run validate
      - run: npm test
      - name: Verify clasp outside repository cwd
        run: |
          CLASP_BINARY="$GITHUB_WORKSPACE/node_modules/.bin/clasp"
          test -x "$CLASP_BINARY"
          test "$(cd "$(mktemp -d)" && "$CLASP_BINARY" --version)" = "3.3.0"
