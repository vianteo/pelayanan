name: Rollback Apps Script
on:
  workflow_dispatch:
    inputs:
      version:
        description: Positive Apps Script version number
        required: true
        type: number
permissions:
  contents: read
concurrency:
  group: jadwal-pelayanan-production
  cancel-in-progress: false
jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - name: Restore clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          CLASP_JSON: ${{ secrets.CLASP_JSON }}
        run: |
          test -n "$CLASPRC_JSON" && test -n "$CLASP_JSON"
          umask 077
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          printf '%s' "$CLASP_JSON" > .clasp.json
      - name: Roll back deployment
        env:
          APPS_SCRIPT_VERSION: ${{ inputs.version }}
        run: npm run rollback
      - name: Cleanup credentials
        if: always()
        run: rm -f "$HOME/.clasprc.json" .clasp.json
